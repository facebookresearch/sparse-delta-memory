# Builds the sdist and wheel of sparse-delta-memory and publishes them with PyPI Trusted Publishing
# (OpenID Connect: no API token is stored in this repository).
#
# - Publishing a GitHub Release for tag vX.Y.Z uploads that version to PyPI (environment "pypi").
# - Running this workflow by hand (Actions > Release > Run workflow) on a tag uploads it to TestPyPI
#   (environment "testpypi"), a rehearsal that never touches PyPI.
# Each index needs a trusted publisher for this repository, this workflow file (release.yml) and the
# environment named above.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build the distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
          sha256sum dist/*
      - name: Check that the tag and the distributions carry the package version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(python -c 'import ast; t = ast.parse(open("sparse_delta_memory/__init__.py").read()); print(next(n.value.value for n in t.body if isinstance(n, ast.Assign) and any(getattr(x, "id", None) == "__version__" for x in n.targets)))')
          echo "package version: $version, ref: $REF_TYPE $REF_NAME"
          test "$REF_TYPE" = tag || { echo "run this workflow on a release tag"; exit 1; }
          test "$REF_NAME" = "v$version" || { echo "tag $REF_NAME does not match version $version"; exit 1; }
          test -f "dist/sparse_delta_memory-$version.tar.gz" || { echo "no sdist for version $version"; exit 1; }
          test -f "dist/sparse_delta_memory-$version-py3-none-any.whl" || { echo "no wheel for version $version"; exit 1; }
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sparse-delta-memory
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

  testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/sparse-delta-memory
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
