# Template config for a three-way hybrid: sliding-window attention (SWA) + full
# attention + Sparse-Delta-Memory (SDM), all in one model. Demonstrates the explicit,
# exhaustive per-layer type assignment and per-type head configuration.
# Change dump_dir, data.root_dir and data.tokenizer.path before launching.
#
# Layer types are declared explicitly via three lists that must together cover every
# layer exactly once (no gaps, no overlaps): attn_at / swa_at / sdm_at. There is no
# implicit default. SWA layers use their own window + head configuration, independent of
# the full-attention layers (here: fewer heads, GQA, and a smaller head_dim).

# dump_dir: !!CHANGETHIS!!
name: "debug_hybrid"
steps: 1000
probe_freq: 100
seed: 777
optim:
    lr: 3e-4
    warmup: 200
    lr_min_ratio: 0.000001
    clip: 1.0

distributed:
    fsdp_type: full_shard
    compile: false          # keep off for a quick debug run
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

model:
    dim: 1024
    n_layers: 8
    n_heads: 8              # full-attention layers: head_dim = 1024/8 = 128
    # Explicit per-layer split — every layer in exactly one list:
    swa_at: [0, 2]         # sliding-window attention
    attn_at: [4, 6]        # full causal attention
    sdm_at: [1, 3, 5, 7]   # Sparse-Delta-Memory
    # Sliding-window attention configuration (independent of full attention):
    swa_window: 256
    swa_n_heads: 4         # different head count from full attention
    swa_n_kv_heads: 2      # GQA on the SWA layers
    swa_head_dim: 64       # different head_dim -> its own RoPE table
    sdm_args:
        slots_per_head: 4096    # perfect square (64^2); total = slots_per_head * num_heads^2
        num_heads: 1
        num_reads: 32
        num_writes: 32
        memory_block_size: 64
        output_gate: true
        backprop_on_memory: false
        read_act: Softmax
        write_act: Softmax
        snapshot_quant: "none"

data:
    root_dir: data/shuffled
    sources:
        dclm_baseline_1.0: 1.0
    batch_size: 8
    prefetch_size: 64
    seq_len: 2048
    n_views: 2
    load_async: true
    tokenizer:
        name: bytes

profiling:
    run: false

checkpoint:
    dump:
        every: 500
        keep: 1
    eval:
        every: 500
        keep: 1

logging:
    freq: 10
