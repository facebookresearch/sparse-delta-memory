# Template config for a small Sparse-Delta-Memory (SDM) debug run.
# Change dump_dir, data.root_dir and data.tokenizer.path before launching.
#
# SDM replaces attention at the layers listed in model.sdm_at; the remaining
# layers (model.attn_at) use standard attention (a hybrid, as in the paper).

# dump_dir: !!CHANGETHIS!!
name: "debug_sdm"
steps: 1000
probe_freq: 100
seed: 777
optim:
    lr: 3e-4
    warmup: 200
    lr_min_ratio: 0.000001
    clip: 1.0

distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: false
    tp_size: 1

model:
    dim: 1024
    n_layers: 8
    n_heads: 8
    # Explicit per-layer split (must cover all n_layers exactly once):
    attn_at: [0, 2, 4, 6]   # standard attention
    sdm_at: [1, 3, 5, 7]    # Sparse-Delta-Memory
    sdm_args:
        slots_per_head: 4096    # perfect square (64^2); memory bank = num_heads * slots_per_head
        num_heads: 1
        num_reads: 32
        num_writes: 32
        chunk_size: 64
        output_gate: true
        backprop_on_memory: false
        read_act: Softmax
        write_act: Softmax
        snapshot_quant: "none"
        cuda_graph: true        # replay the SDM write/read from CUDA graphs (sparse_delta_memory/README.md)

data:
    root_dir: data/shuffled
    sources:
        dclm_baseline_1.0: 1.0
    batch_size: 8
    prefetch_size: 64
    seq_len: 2048
    n_views: 2
    load_async: true
    tokenizer:
        name: bytes

profiling:
    run: false

checkpoint:
    dump:
        every: 500
        keep: 1
    eval:
        every: 500
        keep: 1

logging:
    freq: 10
