# Attention baseline for sdm_7B — 7B-scale, same 3:1 SWA backbone but the global slots are
# FULL ATTENTION instead of SDM. A/B control for sdm_7B.yaml (byte-identical dim / n_layers /
# SWA config; only the global-layer type differs).
# Change dump_dir, data.root_dir and data.tokenizer.path before launching.

# dump_dir: !!CHANGETHIS!!
name: "baseline_7B"
steps: 100000
seed: 777
optim:
    lr: 1.0e-3
    warmup: 2000
    scheduler: cosine
    lr_min_ratio: 0.01
    clip: 1.0

distributed:
    fsdp_type: full_shard
    compile: true
    model_dtype: bf16
    matmul_allow_tf32: false
    selective_activation_checkpointing: true
    tp_size: 1

model:
    dim: 4096
    n_layers: 32
    n_heads: 32          # full-attention (global) layers: 32 query heads, head_dim = 128
    n_kv_heads: 16       # GQA 2:1 on the global full-attention layers
    rope_theta: 100000.0
    attn_gate: true      # sigmoid(w_gate(x)) gate on all attention (SWA + full) outputs, à la amaia_mixatt
    # 3:1 hybrid — full (global) attention every 4th layer, sliding-window attention on the rest.
    attn_at: [3, 7, 11, 15, 19, 23, 27, 31]
    swa_at: [0, 1, 2, 4, 5, 6, 8, 9, 10, 12, 13, 14, 16, 17, 18, 20, 21, 22, 24, 25, 26, 28, 29, 30]
    # Sliding-window (local) attention configuration (identical to sdm_7B.yaml):
    swa_window: 1024
    swa_n_heads: 32
    swa_n_kv_heads: 32   # SWA uses MHA

data:
    root_dir: data/shuffled
    sources:
        dclm_baseline_1.0: 1.0
    batch_size: 1
    prefetch_size: 64
    seq_len: 4096
    n_views: 2
    load_async: true
    tokenizer:
        name: bytes

profiling:
    run: false

checkpoint:
    dump:
        every: 5000
        keep: 1
    eval:
        every: 10000
        keep: 1

logging:
    freq: 10
